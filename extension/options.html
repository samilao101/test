<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Media Remote settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; color: #1f1f1f; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    button { margin-top: 16px; padding: 8px 16px; font: inherit; }
    #status { margin-top: 16px; }
    .connected { color: #1e7d32; }
  </style>
</head>
<body>
  <h1>Media Remote</h1>
  <form id="form">
    <label for="relayUrl">Relay URL</label>
    <input id="relayUrl" type="url" placeholder="https://media-remote-relay.you.workers.dev" required>
    <label for="token">Token</label>
    <input id="token" type="password" placeholder="Same AUTH_TOKEN you set on the worker" required>
    <button type="submit">Save</button>
  </form>
  <p id="status">Status: <span id="connection">…</span></p>
  <script src="options.js"></script>
</body>
</html>
