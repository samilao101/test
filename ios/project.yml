name: MediaRemote
options:
  deploymentTarget:
    iOS: "17.0"

# Edit these two once. They survive re-running xcodegen.
#   BUNDLE_ID_PREFIX: something unique to you, e.g. com.samilao
#   DEVELOPMENT_TEAM: your Team ID (Xcode > Settings > Accounts, or developer.apple.com > Membership)
settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  MediaRemote:
    type: application
    platform: iOS
    sources:
      - path: MediaRemote
        excludes: ["*.example"]
    dependencies:
      - target: MediaRemoteWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).MediaRemote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Media Remote
    info:
      path: MediaRemote/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # Live Activity (Dynamic Island + Lock Screen). The toggle button's intent
  # runs in the app's process, so the extension just needs the shared code to compile.
  MediaRemoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - MediaRemoteWidget
      - MediaRemote/RelayClient.swift
      - MediaRemote/Keychain.swift
      - MediaRemote/Secrets.swift
      - MediaRemote/MediaActivity.swift
      - MediaRemote/ToggleMediaIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).MediaRemote.Widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Media Remote
    info:
      path: MediaRemoteWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
